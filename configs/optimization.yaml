# Optimization Framework Configuration — SIH 26120
algorithm:
  primary: "nsga2"
  population_size: 40
  n_generations: 50
  crossover_prob: 0.9
  mutation_prob: 0.1
  random_seed: 42

bounds:
  css:
    steam_volume_tonnes: [1000.0, 5000.0]
    injection_rate_tonnes_day: [100.0, 300.0]
    injection_pressure_psi: [1200.0, 2100.0]
    soak_duration_days: [3.0, 14.0]
    cycle_cutoff_rate_bpd: [10.0, 35.0]
  srp:
    spm: [1.8, 6.5]
    stroke_length_inch: [74.0, 120.0]
    downstroke_speed_ratio: [0.4, 1.0]

objectives:
  weights:
    net_benefit: 0.50
    sor_minimization: 0.30
    mechanical_wear: 0.20

constraints:
  enforce_strict: true
  penalty_factor: 1e6
  max_allowable_stress_ratio: 0.85
  min_rod_float_margin_lbs: 250.0
