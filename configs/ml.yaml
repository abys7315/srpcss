# Machine Learning & AI Model Configuration — SIH 26120
model_registry:
  base_dir: "backend/ml/registry/artifacts"
  active_version: "v1.0.0-sim"

residual_model:
  type: "xgboost"
  n_estimators: 100
  learning_rate: 0.05
  max_depth: 4
  subsample: 0.8

dynacard_classifier:
  type: "cnn1d"
  input_dimension: 200
  num_classes: 6
  classes:
    - "NORMAL"
    - "ROD_FLOATING"
    - "FLUID_POUND"
    - "GAS_INTERFERENCE"
    - "PARTED_ROD"
    - "HIGH_FLUID_DRAG"

confidence:
  conformal_alpha: 0.10
  minimum_confidence_threshold: 0.70
  flag_low_confidence: true

drift:
  psi_threshold: 0.25
  ks_pvalue_threshold: 0.05
  monitoring_window_days: 30
