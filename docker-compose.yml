version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  database:
    image: postgres:15-alpine
    container_name: sih_26120_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sih_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sih_password}
      POSTGRES_DB: ${POSTGRES_DB:-sih_baghewala_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sih_user} -d ${POSTGRES_DB:-sih_baghewala_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Backend API & Digital Twin Service (FastAPI)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih_26120_backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sih_user}:${POSTGRES_PASSWORD:-sih_password}@database:5432/${POSTGRES_DB:-sih_baghewala_db}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - DEFAULT_PROVENANCE_MODE=SIMULATED
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./configs:/app/configs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # Frontend Decision Support Dashboard (React + Vite)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sih_26120_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
    driver: local
